# The money paths, end to end, on every push.
#
# A throwaway Postgres 17 is started for the run, the schema is applied and
# the fixture rows are seeded (web/scripts/seed-e2e.mts). The site is built
# and started the way Vercel runs it (next build, next start), and
# web/e2e/flows drives it as a buyer, a partner and a member of staff: an
# enquiry, a partner registering and adding a bank account, a car sold with a
# commission attributed and paid. The read-only walkthrough (web/e2e/smoke)
# then runs against the same server. The database dies with the runner, so
# nothing here can touch the live site or its data.
#
# Secrets (repository → Settings → Secrets and variables → Actions). Without
# them the staff tests are skipped, not failed:
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
#     so staff sign-in works against the real Supabase project
#   E2E_STAFF_EMAIL, E2E_STAFF_PASSWORD
#     a staff sign-in whose staff row exists only in the throwaway database (docs/LAUNCH.md, A.10)

name: End to end

on:
  push:
    branches: [platform]
    paths:
      - "web/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still going.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Money paths on a throwaway database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sabicars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sabicars"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sabicars
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/sabicars
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
      # Lets the flows suite call the cron routes and /api/ops/alert; worthless outside this runner.
      CRON_SECRET: e2e
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # The service key and the test staff password are given only to the one step that needs each,
      # never to the whole job: npm ci runs other people's install scripts, and the repository is public.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Create the schema
        # Not npm run db:migrate, which insists on a .env.local file.
        run: node scripts/migrate.mjs

      - name: Seed the throwaway database
        # The test cars, then the real articles and published answers from the repository, so the
        # walkthrough opens an article (with its live illustrations) and an answer instead of skipping them.
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
        run: |
          node --import tsx scripts/seed-e2e.mts
          node --import tsx scripts/seed-articles.mts
          node --import tsx scripts/seed-ask.mts

      - name: Cheap gates first
        run: npm run test:ledger && npm run test:schema

      - name: Prove a backup restores exactly
        # Exports the seeded database through lib/backup.ts, restores it into an empty database
        # beside it, and compares every table row for row (scripts/verify-backup.mts).
        run: npm run test:backup

      - name: Prove the email outbox loses nothing
        # 250 emails at once against a stand-in for Resend that is busy at first and refuses one bad
        # address: every email is sent exactly once, the bad one fails alone, a day-old one expires
        # and a dead sender's claim is released (scripts/verify-outbox.mts). Runs before the site
        # starts, so the outbox holds nothing else.
        run: npm run test:outbox

      - name: Build the site
        run: npx next build

      - name: Start the site
        id: start
        run: |
          nohup npx next start -p 3000 > server.log 2>&1 &
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:3000/api/health || true)
            if [ "$code" = "200" ]; then
              echo "Up after $attempt attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::http://localhost:3000/api/health did not answer 200 within two minutes (last answer: HTTP ${code:-none})."
          cat server.log
          exit 1

      - name: Drive the money paths
        # The staff sign-in happens in Node (e2e/helpers.ts signInAsStaff), so the password is never typed
        # into a page whose trace the failure artifact below would publish, and the session is revoked at the end.
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}

      - name: Walk the site as a buyer and as staff
        # Runs even when a money path failed, so one run tells the whole story.
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: npm run test:smoke
        env:
          SMOKE_BASE_URL: http://localhost:3000

      - name: Keep the report, the traces and the server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            web/e2e-report
            web/e2e-results
            web/server.log
          if-no-files-found: ignore
          retention-days: 14
